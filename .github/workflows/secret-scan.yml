# Secret scan on every push and pull request (gitleaks, only the new commits).
# Source of truth: claude-config/git/templates/secret-scan.yml. Config: .gitleaks.toml in this repo.
name: secret-scan
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.30.1
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
      - name: Scan new commits
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then range="$BASE_SHA..$HEAD_SHA"
          elif echo "$BEFORE" | grep -qE '^0+$'; then range="-1 $HEAD_SHA"
          else range="$BEFORE..$HEAD_SHA"; fi
          ./gitleaks git . -c .gitleaks.toml --redact --no-banner -v --log-opts="$range"
